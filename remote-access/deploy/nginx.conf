# Merge these locations into the existing HTTPS virtual host. Terminate TLS with
# your managed certificate. Do not log query strings, bodies, cookies or WS data.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 443 ssl;
    server_name infrascope.example.internal;
    ssl_certificate /etc/infrascope/tls/fullchain.pem;
    ssl_certificate_key /etc/infrascope/tls/key.pem;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
    }
}
