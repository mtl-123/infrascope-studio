[package]
name = "infrascope-telemetry"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Proprietary"
description = "InfraScope host, Docker and Proxmox telemetry clients"

[lib]
name = "infrascope_telemetry"
path = "src/lib.rs"

[[bin]]
name = "infrascope-agent"
path = "src/main.rs"

[[bin]]
name = "infrascope-docker-collector"
path = "src/bin/docker.rs"

[[bin]]
name = "infrascope-pve-collector"
path = "src/bin/pve.rs"

[dependencies]
anyhow = "=1.0.100"
base64 = "=0.22.1"
chrono = { version = "=0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "=4.5.50", features = ["derive"] }
ctrlc = { version = "=3.5.0", features = ["termination"] }
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
fs2 = "=0.4.3"
hex = "=0.4.3"
rand = "=0.8.5"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
sysinfo = "=0.33.1"
toml = "=0.8.23"
url = "=2.5.7"
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-service = "=0.8.0"
windows-sys = { version = "=0.59.0", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
